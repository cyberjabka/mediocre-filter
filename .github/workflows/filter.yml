name: Filter keys by region

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  filter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and filter
        run: |
          curl -s "https://raw.githubusercontent.com/zieng2/wl/main/vless_lite.txt" | \
          python3 -c "
          import sys, urllib.parse
          from collections import defaultdict

          groups = defaultdict(list)

          for line in sys.stdin:
              line = line.strip()
              if not line or '#' not in line:
                  continue
              fragment = urllib.parse.unquote(line.split('#', 1)[1])
              parts = fragment.split('—')
              group_key = parts[0].strip() if len(parts) > 1 else fragment.strip()
              groups[group_key].append(line)

          total = 0
          for group_key, keys in groups.items():
              for key in keys[:5]:
                  print(key)
                  total += 1

          import sys
          print(f'Total: {total} keys from {len(groups)} regions', file=sys.stderr)
          " > filtered.txt
          echo "Done: $(wc -l < filtered.txt) lines"

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add filtered.txt
          git diff --cached --quiet || git commit -m "Update $(date -u '+%Y-%m-%d')"
          git push
