name: Filter keys by region

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  filter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and filter
        run: |
          curl -s "https://raw.githubusercontent.com/zieng2/wl/main/vless_lite.txt" | \
          python3 -c "
          import sys, urllib.parse
          from collections import defaultdict

          RU_PROVIDERS = ['VK', 'Yandex', 'Timeweb']
          RU_PER_PROVIDER = 2

          by_country = defaultdict(list)
          ru_by_provider = defaultdict(list)

          for line in sys.stdin:
              line = line.strip()
              if not line or '#' not in line:
                  continue
              fragment = urllib.parse.unquote(line.split('#', 1)[1])
              parts = fragment.split('—')
              if len(parts) < 2:
                  continue
              group = parts[0].strip()  # например '🇷🇺 VK' или '🇩🇪 Germany'
              words = group.split()
              flag = words[0]           # эмодзи флага
              provider = ' '.join(words[1:]) if len(words) > 1 else ''

              if flag == '🇷🇺':
                  for p in RU_PROVIDERS:
                      if p.lower() in provider.lower():
                          ru_by_provider[p].append(line)
                          break
              else:
                  by_country[flag].append(line)

          # RU: по 2 от каждого провайдера
          for p in RU_PROVIDERS:
              for key in ru_by_provider[p][:RU_PER_PROVIDER]:
                  print(key)

          # Остальные страны: по 5
          for flag, keys in by_country.items():
              for key in keys[:5]:
                  print(key)
          " > filtered.txt
          echo "Done: $(wc -l < filtered.txt) lines"

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add filtered.txt
          git diff --cached --quiet || git commit -m "Update $(date -u '+%Y-%m-%d')"
          git push
